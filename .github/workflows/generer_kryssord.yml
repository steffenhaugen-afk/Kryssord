name: Generer ukentlige kryssord

on:
  schedule:
    - cron: "0 6 * * 1"   # Hver mandag kl. 06:00 UTC
  workflow_dispatch:        # Manuell kjøring fra GitHub UI
    inputs:
      storrelse:
        description: "Størrelser (space-separert, f.eks. '9 13 17')"
        required: false
        default: "9 13 17"
      publiser:
        description: "Publiser kryssordene automatisk"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  generer:
    name: Generer og publiser kryssord
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer avhengigheter
        run: pip install -r backend/requirements.txt

      - name: Generer og publiser kryssord
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STORLST: ${{ github.event.inputs.storrelse || '9 13 17' }}
          PUBLISER: ${{ github.event.inputs.publiser || 'true' }}
        run: |
          python - <<'PYEOF'
          import os, sys
          sys.path.insert(0, "backend")

          from generator import generer_og_lagre
          from generator.ledetrad_generator import LedetradGenerator

          db_url   = os.environ["DATABASE_URL"]
          storlst  = [int(s) for s in os.environ["STORLST"].split()]
          publiser = os.environ["PUBLISER"].lower() == "true"
          gen_led  = LedetradGenerator(db_url)

          resultater = []
          for storrelse in storlst:
              vanskelighet = {9: "lett", 13: "middels", 17: "vanskelig"}.get(storrelse, "middels")
              print(f"\n==> Genererer {storrelse}×{storrelse} ({vanskelighet}) ...")
              try:
                  info = generer_og_lagre(
                      database_url=db_url,
                      storrelse=storrelse,
                      vanskelighetsgrad=vanskelighet,
                      publiser=publiser,
                      maks_tid=60.0,
                  )
                  print(f"    Lagret: id={info['id']}, {info['antall_ord']} ord")
                  # Berik med ledetråder
                  stats = gen_led.oppdater_kryssord_i_db(info["id"])
                  print(f"    Ledetråder: {stats['totalt']} ord "
                        f"({stats['per_kilde']})")
                  resultater.append({"storrelse": storrelse, "id": info["id"],
                                     "ord": info["antall_ord"], "ok": True})
              except Exception as exc:
                  print(f"    FEIL: {exc}", file=sys.stderr)
                  resultater.append({"storrelse": storrelse, "ok": False, "feil": str(exc)})

          print("\n=== Rapport ===")
          ok  = [r for r in resultater if r["ok"]]
          fei = [r for r in resultater if not r["ok"]]
          for r in ok:
              print(f"  ✓ {r['storrelse']}×{r['storrelse']}  id={r['id']}  {r['ord']} ord")
          for r in fei:
              print(f"  ✗ {r['storrelse']}×{r['storrelse']}  {r['feil']}")
          if fei:
              sys.exit(1)
          PYEOF

      - name: Verifiser siste publiserte kryssord
        if: always()
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          python - <<'PYEOF'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute("""
                  SELECT grid_storrelse, tittel, opprettet_dato
                  FROM kryssord
                  WHERE publisert = true
                  ORDER BY opprettet_dato DESC
                  LIMIT 6
              """)
              rows = cur.fetchall()
          conn.close()
          print(f"Siste {len(rows)} publiserte kryssord:")
          for r in rows:
              print(f"  {r[0]:2}×{r[0]:<2}  |  {r[1]:<35}  |  {r[2]}")
          PYEOF
