name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------
  # Frontend – Next.js → Vercel
  # -------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer avhengigheter
        working-directory: frontend
        run: npm ci

      - name: Bygg
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy til Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest --prefer-offline
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # -------------------------------------------------------------------------
  # Backend – FastAPI → Railway
  # -------------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend (Railway)
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer avhengigheter
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Kjør tester
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
          ADMIN_API_KEY: "test-admin-key"
        run: pytest tests/ -q --tb=short

      - name: Installer Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy til Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service backend --detach

  # -------------------------------------------------------------------------
  # Migrasjoner – kjøres etter backend er oppe
  # -------------------------------------------------------------------------
  migrate:
    name: Kjør databasemigrasjoner
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer psycopg2
        run: pip install psycopg2-binary python-dotenv

      - name: Kjør migrasjoner
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: python database/migrate.py
