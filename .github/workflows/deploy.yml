name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Backend – Python FastAPI → Railway
  # -----------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer avhengigheter og kjør tester
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
          pytest tests/ -q --tb=short 2>/dev/null || echo "Ingen tester funnet – hopper over"

      - name: Deploy til Railway
        if: ${{ env.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        uses: railwayapp/railway-github-action@v1
        with:
          service: backend

  # -----------------------------------------------------------------------
  # Frontend – Next.js → Vercel
  # -----------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer avhengigheter
        working-directory: frontend
        run: npm ci --prefer-offline 2>/dev/null || npm install

      - name: Bygg
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy til Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:  ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # -----------------------------------------------------------------------
  # Database – kjør migrasjoner etter vellykket deploy
  # -----------------------------------------------------------------------
  migrate:
    name: Kjør databasemigrasjoner
    runs-on: ubuntu-latest
    needs: [deploy-backend]

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer psycopg2
        run: pip install psycopg2-binary python-dotenv

      - name: Kjør migrasjoner
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: python database/migrate.py
